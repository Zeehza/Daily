name: Hourly Commit

on:
  schedule:
    - cron: "0 */3 * * *" # Menjalankan setiap 3 jam (menit ke-0)
  workflow_dispatch: # Memungkinkan untuk dijalankan secara manual

jobs:
  auto-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Dibutuhkan untuk melakukan push
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Update Timestamp
        run: |
          echo "Last updated at $(date -u)" > LAST_UPDATED.txt

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git add LAST_UPDATED.txt

          # Hanya commit jika ada perubahan
          git diff --quiet && git diff --staged --quiet || git commit -m "chore: auto update timestamp [skip ci]"

          git push
